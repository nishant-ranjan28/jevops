name: Bug report
description: Something behaves differently from what the README says.
labels: [bug]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [PR Risk Analyzer, Bug Triage, Deployment Gate, Live PR review, Not mode-specific]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Shown in the LIVE/MOCK badge in the header.
      options: [mock, openrouter, groq, Other / not sure]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The input you pasted (or the demo you clicked) and anything else needed to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "24.x"
